<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="보안, 데이터, 클라우드, AI, 게임 프로젝트를 네트워크 그래프로 탐색하는 이현수의 포트폴리오">
  <meta name="theme-color" content="#f2f0ea">
  <title>이현수 — Project Graph</title>
  <link rel="stylesheet" href="./assets/index.css">
</head>
<body>
  <main class="network-app">
    <aside class="sidebar">
      <header class="profile">
        <h1><span aria-hidden="true"></span>이현수</h1>
        <p>Computer Science<br>Dongguk University</p>
      </header>
      <nav class="legend" id="legend" aria-label="프로젝트 분야 필터"></nav>
      <nav aria-label="연락처">
        <a href="https://github.com/hyunsuhahaha" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <a href="mailto:hyunsuhahaha@gmail.com">Email ↗</a>
      </nav>
    </aside>

    <svg class="network" id="network" viewBox="0 0 1400 850" role="application" aria-label="프로젝트 네트워크 그래프. 노드를 드래그하고 프로젝트를 선택할 수 있습니다.">
      <rect class="canvas-background" width="1400" height="850"></rect>
      <g id="viewport">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <div class="graph-controls" aria-label="그래프 보기 조절">
      <button type="button" id="zoom-out" aria-label="축소">−</button>
      <button type="button" id="reset-view" aria-label="그래프 위치 초기화">○</button>
      <button type="button" id="zoom-in" aria-label="확대">＋</button>
    </div>

    <aside class="detail-panel" id="detail-panel" aria-live="polite" aria-hidden="true"></aside>
  </main>
  <script src="./assets/index.js"></script>
</body>
</html>
